<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" preserveAspectRatio="xMidYMid slice">
  <rect width="1920" height="1080" fill="#FAF9F6"/>
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E4DC"/>
      <stop offset="45%" stop-color="#E8B8AC"/>
      <stop offset="100%" stop-color="#D09484"/>
    </linearGradient>
    <linearGradient id="p2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3D2C6"/>
      <stop offset="100%" stop-color="#C88778"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4C9A8"/>
      <stop offset="100%" stop-color="#738C69"/>
    </linearGradient>
    <linearGradient id="leafDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A38C"/>
      <stop offset="100%" stop-color="#5F7A56"/>
    </linearGradient>
    <radialGradient id="softCenter" cx="50%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#FAF9F6" stop-opacity="1"/>
      <stop offset="55%" stop-color="#FAF9F6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LEFT: clover / leaf clusters -->
  <g opacity="0.95">
    <g transform="translate(60,140)">
      <g fill="url(#leaf)" stroke="#5E7854" stroke-width="1.4">
        <ellipse cx="110" cy="80" rx="64" ry="46" transform="rotate(-30 110 80)"/>
        <ellipse cx="185" cy="60" rx="64" ry="46" transform="rotate(22 185 60)"/>
        <ellipse cx="150" cy="135" rx="64" ry="46" transform="rotate(72 150 135)"/>
        <ellipse cx="85" cy="150" rx="56" ry="40" transform="rotate(-58 85 150)"/>
      </g>
      <path d="M150 130 C145 210 165 300 185 390" stroke="#5E7854" stroke-width="3.5" stroke-linecap="round"/>
      <g fill="none" stroke="#5E7854" stroke-width="1" opacity="0.4">
        <path d="M110 80 L150 125"/><path d="M185 60 L150 125"/><path d="M150 135 L150 125"/>
      </g>
    </g>
    <g transform="translate(40,380)">
      <g fill="url(#leafDeep)" stroke="#5E7854" stroke-width="1.2">
        <ellipse cx="100" cy="60" rx="54" ry="38" transform="rotate(-18 100 60)"/>
        <ellipse cx="160" cy="48" rx="54" ry="38" transform="rotate(28 160 48)"/>
        <ellipse cx="130" cy="110" rx="54" ry="38" transform="rotate(78 130 110)"/>
      </g>
      <path d="M130 105 C125 180 140 250 160 320" stroke="#5E7854" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(220,620)" fill="url(#leaf)" stroke="#5E7854" stroke-width="1.1" opacity="0.88">
      <ellipse cx="70" cy="40" rx="42" ry="28" transform="rotate(-42 70 40)"/>
      <ellipse cx="115" cy="58" rx="42" ry="28" transform="rotate(35 115 58)"/>
      <ellipse cx="85" cy="90" rx="40" ry="26" transform="rotate(88 85 90)"/>
      <path d="M90 70 C105 130 125 190 150 250" stroke="#5E7854" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(320,180)" fill="url(#leaf)" stroke="#5E7854" stroke-width="1" opacity="0.55">
      <ellipse cx="50" cy="35" rx="36" ry="24" transform="rotate(15 50 35)"/>
      <ellipse cx="85" cy="55" rx="34" ry="22" transform="rotate(60 85 55)"/>
    </g>
  </g>

  <!-- RIGHT: peony / poppy blooms -->
  <g transform="translate(1120,40)">
    <!-- main bloom -->
    <g>
      <ellipse cx="260" cy="240" rx="118" ry="86" fill="url(#p1)" transform="rotate(-14 260 240)" opacity="0.96"/>
      <ellipse cx="340" cy="190" rx="108" ry="78" fill="url(#p2)" transform="rotate(28 340 190)" opacity="0.94"/>
      <ellipse cx="380" cy="275" rx="110" ry="80" fill="url(#p1)" transform="rotate(58 380 275)" opacity="0.92"/>
      <ellipse cx="290" cy="330" rx="105" ry="76" fill="url(#p2)" transform="rotate(-38 290 330)" opacity="0.94"/>
      <ellipse cx="215" cy="270" rx="100" ry="72" fill="url(#p1)" transform="rotate(-72 215 270)" opacity="0.92"/>
      <ellipse cx="300" cy="220" rx="70" ry="52" fill="#E8B8AC" opacity="0.85"/>
      <circle cx="300" cy="255" r="34" fill="#C97A68"/>
      <circle cx="300" cy="255" r="16" fill="#A85C4C"/>
      <g stroke="#B97A56" stroke-width="1.15" opacity="0.4" fill="none">
        <path d="M300 255 C250 195 210 165 175 145"/>
        <path d="M300 255 C350 175 400 155 445 148"/>
        <path d="M300 255 C380 235 430 265 470 305"/>
        <path d="M300 255 C335 320 350 375 355 420"/>
        <path d="M300 255 C240 310 195 350 165 380"/>
        <path d="M300 255 C280 180 300 150 320 130"/>
      </g>
    </g>
    <!-- secondary bloom -->
    <g transform="translate(340,330)">
      <ellipse cx="110" cy="85" rx="68" ry="48" fill="url(#p2)" transform="rotate(18 110 85)"/>
      <ellipse cx="150" cy="120" rx="64" ry="46" fill="url(#p1)" transform="rotate(52 150 120)"/>
      <ellipse cx="85" cy="125" rx="62" ry="44" fill="url(#p2)" transform="rotate(-28 85 125)"/>
      <ellipse cx="120" cy="95" rx="40" ry="30" fill="#E8B8AC"/>
      <circle cx="118" cy="108" r="18" fill="#C97A68"/>
    </g>
    <!-- buds -->
    <g fill="url(#p1)" stroke="#B97A56" stroke-width="1.2">
      <ellipse cx="520" cy="130" rx="34" ry="44" transform="rotate(20 520 130)"/>
      <ellipse cx="570" cy="210" rx="26" ry="36" transform="rotate(-12 570 210)"/>
      <ellipse cx="480" cy="430" rx="28" ry="38" transform="rotate(28 480 430)"/>
      <ellipse cx="560" cy="380" rx="22" ry="30" transform="rotate(-8 560 380)"/>
    </g>
    <path d="M300 300 C325 410 380 520 430 640" stroke="#6F8A63" stroke-width="4" stroke-linecap="round"/>
    <path d="M420 380 C460 470 500 560 540 650" stroke="#6F8A63" stroke-width="3" stroke-linecap="round"/>
    <g fill="url(#leaf)" stroke="#5E7854" stroke-width="1.2">
      <ellipse cx="360" cy="480" rx="58" ry="26" transform="rotate(-38 360 480)"/>
      <ellipse cx="470" cy="540" rx="52" ry="24" transform="rotate(42 470 540)"/>
      <ellipse cx="400" cy="600" rx="48" ry="22" transform="rotate(-20 400 600)"/>
    </g>
  </g>

  <!-- upper-right mini bloom -->
  <g transform="translate(1480,30)" opacity="0.9">
    <ellipse cx="70" cy="55" rx="48" ry="34" fill="url(#p2)" transform="rotate(-22 70 55)"/>
    <ellipse cx="110" cy="80" rx="44" ry="32" fill="url(#p1)" transform="rotate(32 110 80)"/>
    <ellipse cx="55" cy="95" rx="42" ry="30" fill="url(#p2)" transform="rotate(72 55 95)"/>
    <circle cx="78" cy="76" r="14" fill="#C97A68"/>
  </g>

  <!-- lower-right soft petals -->
  <g transform="translate(1580,680)" opacity="0.55" fill="url(#p1)">
    <ellipse cx="40" cy="30" rx="36" ry="24" transform="rotate(25 40 30)"/>
    <ellipse cx="70" cy="50" rx="32" ry="22" transform="rotate(-15 70 50)"/>
  </g>

  <!-- readable CTA zone -->
  <rect width="1920" height="1080" fill="url(#softCenter)"/>
</svg>
